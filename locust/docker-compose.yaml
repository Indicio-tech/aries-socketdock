services:
  locust-socketdock:
    build: .
    depends_on:
      - websocket-gateway
    # Loopback only: the Locust UI is unauthenticated and the mock backend on
    # 4242 accepts anything. SocketDock reaches 4242 over the compose network.
    ports:
      - "127.0.0.1:8089:8089"
    environment:
      - SOCKETDOCK_WS_URL=${SOCKETDOCK_WS_URL:-ws://websocket-gateway:8765/ws}
      - LOCUST_MIN_WAIT=${LOCUST_MIN_WAIT:-0.1}
      - LOCUST_MAX_WAIT=${LOCUST_MAX_WAIT:-1}
      - LOCUST_CONNECT_TIMEOUT=${LOCUST_CONNECT_TIMEOUT:-10}
      - LOCUST_REPLY_GRACE=${LOCUST_REPLY_GRACE:-2}
      - LOCUST_CLOSE_GRACE=${LOCUST_CLOSE_GRACE:-1}
    volumes:
      - ./:/usr/src/app/locust:z

  websocket-gateway:
    build: ../
    volumes:
      - ../socketdock:/usr/src/app/socketdock:z
    command: >
      --bindip 0.0.0.0
      --backend http
      --connect-uri http://locust-socketdock:4242/connect
      --message-uri http://locust-socketdock:4242/message
      --disconnect-uri http://locust-socketdock:4242/disconnect
      --endpoint http://websocket-gateway:8765
      --log-level WARNING
